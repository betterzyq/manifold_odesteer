type: CRFDSteer
kwargs:
  solver: euler
  steps: 10
  n_components: 8000
  degree: 2 
  gamma: 0.1
  coef0: 1.0
  lin_clf_type: lr
  # ODE-Manifold (optional): set use_manifold=true and vk_path, or pass --use_manifold --vk_path at CLI
  use_manifold: false
  use_manifold_retraction: false
  vk_path: null
  manifold_dim: 128
T: 1.0
name: ${steer.type}-${steer.kwargs.solver}-steps${steer.kwargs.steps}-nc${steer.kwargs.n_components}-degree${steer.kwargs.degree}-gamma${steer.kwargs.gamma}-coef0${steer.kwargs.coef0}-${steer.kwargs.lin_clf_type}-T${steer.T}
